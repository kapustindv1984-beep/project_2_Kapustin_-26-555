[tool.poetry]
name = "primitive-db"
version = "0.1.0"
description = "Учебный проект: примитивная база данных на JSON-файлах с CLI-интерфейсом"
authors = ["kapustindv1984-beep <kapustindv1984@gmail.com>"]
readme = "README.md"
packages = [{ include = "primitive_db", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
prettytable = "^3.18.0"
prompt = "^0.4.1"
asciinema = "^2.4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
pytest = "^9.2.0"

[tool.poetry.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]